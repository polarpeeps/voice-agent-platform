[project]
name = "voice-agent-platform"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
# onnxruntime, a pipecat-ai dependency, has no Python 3.15 wheels yet.
requires-python = ">=3.11,<3.15"
dependencies = [
    "pipecat-ai[cartesia,deepgram,openai,runner,silero,webrtc]>=1.12.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]